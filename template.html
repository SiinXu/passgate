<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="PassGate template pack — Next.js WebAuthn, Supabase migration, CHECKLIST 30, TEST_PLAN.">
<title data-i18n-title="tpl.title">Template pack · PassGate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307080a'/%3E%3Ccircle cx='12' cy='16' r='4' fill='none' stroke='%2334d399' stroke-width='2'/%3E%3Cpath d='M16 16h10m-3-3v6' fill='none' stroke='%2334d399' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script>
try{const t=localStorage.getItem('passgate-theme');if(t)document.documentElement.dataset.theme=t;
else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light';}catch(e){}
</script>
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="12" r="3.2"/><path d="M11 12h9m-3-3v6"/></svg></span>
      <span data-i18n="brand">PassGate</span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="./#pricing" data-i18n="nav.pricing">Pricing</a>
      <a href="./template.html" data-i18n="nav.template">Template pack</a>
    </nav>
    <div class="nav-tools">
      <select id="lang-select" class="chip" aria-label="Language">
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
      </select>
      <button type="button" class="chip" id="theme-toggle" aria-label="Theme">◐</button>
      <button type="button" class="btn btn-primary" data-checkout data-i18n="nav.buy">Buy template</button>
    </div>
  </div>
</header>

<main id="main" class="wrap tpl-hero">
  <a class="back" href="./" data-i18n="tpl.back">← Back</a>
  <p class="eyebrow" style="margin-top:18px"><i></i><span data-i18n="tpl.hero">Template pack</span></p>
  <h1 data-i18n="tpl.title">Everything in the $49 ZIP</h1>
  <p class="hero-lede" data-i18n="tpl.lede"></p>

  <div class="tpl-grid">
    <section class="tree">
      <h2 data-i18n="tpl.tree.title">Archive layout</h2>
      <ol>
        <li data-i18n="tpl.tree.1"></li>
        <li data-i18n="tpl.tree.2"></li>
        <li data-i18n="tpl.tree.3"></li>
        <li data-i18n="tpl.tree.4"></li>
        <li data-i18n="tpl.tree.5"></li>
        <li data-i18n="tpl.tree.6"></li>
      </ol>
    </section>
    <section class="form-card">
      <h2 data-i18n="tpl.form.title">Notify / order placeholder</h2>
      <form id="interest-form">
        <div class="field">
          <label for="email" data-i18n="tpl.form.email">Work email</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@company.com">
        </div>
        <div class="field">
          <label for="plan" data-i18n="tpl.form.plan">Plan</label>
          <select id="plan" name="plan">
            <option value="template" data-i18n="tpl.form.plan.t">Template $49</option>
            <option value="install" data-i18n="tpl.form.plan.i">Install $299</option>
            <option value="plus" data-i18n="tpl.form.plan.p">Install + notes $499</option>
          </select>
        </div>
        <div class="field">
          <label for="stack" data-i18n="tpl.form.stack">Stack</label>
          <input id="stack" name="stack" type="text" data-i18n-placeholder="tpl.form.stack.ph" placeholder="Next.js + Supabase">
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="tpl.form.submit">即将开通收款</button>
        <p class="form-note" data-i18n="tpl.form.note"></p>
        <div class="form-ok" id="form-ok" data-i18n="tpl.form.saved"></div>
      </form>
    </section>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span data-i18n="footer.tag"></span>
    <span data-i18n="pricing.soon"></span>
  </div>
</footer>

<div class="modal" id="checkout-modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <h3 id="modal-title" data-i18n="modal.title"></h3>
    <p data-i18n="modal.body"></p>
    <div class="modal-actions">
      <button type="button" class="btn" id="modal-close" data-i18n="modal.close"></button>
    </div>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>
